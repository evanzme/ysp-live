services:
  ysp-live:
    image: ghcr.io/evanzme/ysp-live:latest
    container_name: ysp-live
    restart: unless-stopped
    # host 模式直接使用宿主机网络，程序监听 8767
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      # 每个设备获取几个不同的高码率频道后切换到热备设备 (上游默认 6；实测单设备 4~13 个后被风控)
      - YSP_LINKS_PER_DEVICE=4
      # 只让 3 个真 4K/8K 频道走设备协议，其余走 1080p
      # - YSP_ONLY_4K_DEVICE=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
